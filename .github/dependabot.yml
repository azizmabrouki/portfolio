version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
    ignore:
      # @astrojs/check only supports TypeScript 5 and 6 for now; lift this once it accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
