name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, build, links, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # Internal links are resolved against dist/; external links are fetched.
      # linkedin.com is excluded because it answers bots with HTTP 999.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --accept 200..=299,429
            --max-retries 2
            --exclude linkedin\.com
            'dist/**/*.html'

      # Fails the job if any page scores below 95 on any of the four categories.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
